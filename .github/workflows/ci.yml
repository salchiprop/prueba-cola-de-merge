name: ci
on: [pull_request, merge_group]
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sleep 60
      - run: |
          if [ "${{ github.event_name }}" = "merge_group" ] && [ -e romper.txt ]; then echo "romper.txt existe"; exit 1; fi
